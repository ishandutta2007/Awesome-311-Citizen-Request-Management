<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bg-grad)" />

  <!-- Dynamic Animated background shapes -->
  <circle cx="100" cy="100" r="80" fill="#38bdf8" opacity="0.1" filter="url(#glow)">
    <animate attributeName="cy" values="100;120;100" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="80" r="60" fill="#fb7185" opacity="0.1" filter="url(#glow)">
    <animate attributeName="cx" values="700;680;700" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="150" r="50" fill="#c084fc" opacity="0.08" filter="url(#glow)">
    <animate attributeName="r" values="50;70;50" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Graphic Grid/Map representation representing 311 Routing -->
  <g opacity="0.25">
    <line x1="50" y1="30" x2="150" y2="70" stroke="#c084fc" stroke-width="1.5" />
    <line x1="150" y1="70" x2="250" y2="40" stroke="#c084fc" stroke-width="1.5" />
    <line x1="250" y1="40" x2="350" y2="120" stroke="#c084fc" stroke-width="1.5" />
    <line x1="350" y1="120" x2="480" y2="60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="480" y1="60" x2="600" y2="140" stroke="#fb7185" stroke-width="1.5" />
    <line x1="600" y1="140" x2="750" y2="90" stroke="#fb7185" stroke-width="1.5" />

    <!-- Nodes representing Citizen reports -->
    <circle cx="50" cy="30" r="5" fill="#38bdf8">
      <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="70" r="6" fill="#c084fc" />
    <circle cx="250" cy="40" r="5" fill="#fb7185" />
    <circle cx="350" cy="120" r="7" fill="#38bdf8" />
    <circle cx="480" cy="60" r="5" fill="#c084fc" />
    <circle cx="600" cy="140" r="8" fill="#fb7185">
      <animate attributeName="r" values="8;5;8" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="90" r="5" fill="#38bdf8" />
  </g>

  <!-- Central Title Text -->
  <g transform="translate(400, 100)" text-anchor="middle">
    <!-- Subtitle -->
    <text y="-25" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="3">
      AWESOME LIST
    </text>
    
    <!-- Title -->
    <text y="20" fill="url(#text-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="1">
      311 Citizen Request Management
    </text>

    <!-- Tagline -->
    <text y="50" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
      Municipal Service Requests • Non-Emergency Issue Reporting • Civic CRM Systems
    </text>
  </g>
</svg>
